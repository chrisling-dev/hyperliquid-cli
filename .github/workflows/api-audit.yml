name: Hyperliquid API drift
on:
  workflow_dispatch:
  schedule:
    - cron: '19 6 * * *'
concurrency:
  group: hyperliquid-api-audit
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Compare live docs with mappings and reviewed snapshot
        id: audit
        run: npm run --silent api:audit -- --save upstream-docs.json > api-audit-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hyperliquid-api-audit
          path: |
            api-audit-report.json
            upstream-docs.json
      - name: Create or update the audit tracking issue
        if: always() && (steps.audit.outcome == 'success' || steps.audit.outcome == 'failure') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        with:
          script: |
            const { default: sync } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/audit-issue.mjs`);
            await sync({ github, context, outcome: process.env.AUDIT_OUTCOME });
